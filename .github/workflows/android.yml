# 안드로이드 테스트용 APK 자동 빌드
# 브랜치에 올릴 때마다 GitHub가 APK를 만들어 줍니다.
# 받는 법: GitHub 저장소 → Actions → "Android APK" → 최신 실행 → 아래 Artifacts 의 heirs-debug-apk
name: Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: heirs-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
